<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECN Manager</title>
    <meta name="description" content="A web application to manage Engineering Change Notices (ECN) by synchronizing directly with SAP GUI via PowerShell automation or importing SAP files, tracking statuses, and viewing detailed component changes." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "hsl(240 5.9% 90%)",
              input: "hsl(240 5.9% 90%)",
              ring: "hsl(240 5.9% 10%)",
              background: "hsl(0 0% 100%)",
              foreground: "hsl(240 10% 3.9%)",
              primary: {
                DEFAULT: "hsl(0 72.2% 50.6%)",
                foreground: "hsl(0 0% 98%)",
              },
              secondary: {
                DEFAULT: "hsl(240 4.8% 95.9%)",
                foreground: "hsl(240 5.9% 10%)",
              },
              destructive: {
                DEFAULT: "hsl(0 84.2% 60.2%)",
                foreground: "hsl(0 0% 98%)",
              },
              muted: {
                DEFAULT: "hsl(240 4.8% 95.9%)",
                foreground: "hsl(240 3.8% 46.1%)",
              },
              accent: {
                DEFAULT: "hsl(240 4.8% 95.9%)",
                foreground: "hsl(240 5.9% 10%)",
              },
              card: {
                DEFAULT: "hsl(0 0% 100%)",
                foreground: "hsl(240 10% 3.9%)",
              },
              'brand-pending': "hsl(45 93% 47%)",
              'brand-implemented': "hsl(142 76% 36%)",
              'brand-partial': "hsl(217 91% 60%)",
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 3.9%;
        --primary: 0 72.2% 50.6%;
        --primary-foreground: 0 0% 98%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 240 5.9% 10%;
        --radius: 0.5rem;
        --brand-pending: 45 93% 47%;
        --brand-implemented: 142 76% 36%;
        --brand-partial: 217 91% 60%;
      }
    
      .dark {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --card: 222.2 84% 4.9%;
        --card-foreground: 210 40% 98%;
        --popover: 222.2 84% 4.9%;
        --popover-foreground: 210 40% 98%;
        --primary: 346.8 77.2% 49.8%;
        --primary-foreground: 355.7 100% 97.3%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --ring: 212.7 26.8% 83.9%;
        --brand-pending: 48 96% 53%;
        --brand-implemented: 142 70% 45%;
        --brand-partial: 217 91% 60%;
      }
    </style>
    <script>
      // Unregister any stale service workers from previous projects
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
